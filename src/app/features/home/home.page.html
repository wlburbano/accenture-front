<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Accenture TaskManager</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="categoryManagerModal.present()">
        <ion-icon slot="icon-only" name="options-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <app-task-filters [categories]="categories()" (search)="onSearchChange($event)"
    (categoryChange)="onCategoryFilterChange($event)">
  </app-task-filters>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mis Tareas</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding-horizontal ion-padding-top">
    <ion-segment [value]="currentStatus()" (ionChange)="onStatusFilterChange($event)" mode="ios">
      <ion-segment-button value="all">
        <ion-label>Todas</ion-label>
      </ion-segment-button>
      <ion-segment-button value="pending">
        <ion-label>Pendientes</ion-label>
      </ion-segment-button>
      <ion-segment-button value="completed">
        <ion-label>Hechas</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <app-task-list [tasks]="tasks()" [categories]="categories()" (toggle)="onToggleTask($event)"
    (delete)="onDeleteTask($event)" (edit)="onOpenEditModal($event, taskModal)">
  </app-task-list>

  <ion-modal #taskModal initialBreakpoint="0.6" [breakpoints]="[0, 0.6, 0.9]">
    <ng-template>
      <ion-header>
        <ion-toolbar color="light">
          <ion-title>Nueva Tarea</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <app-task-form [categories]="categories()" [isDescriptionEnabled]="isDescriptionEnabled()"
          (submitted)="onSaveTask($event)" [taskToEdit]="selectedTaskForEdit()">
        </app-task-form>
      </ion-content>
    </ng-template>
  </ion-modal>

  <ion-modal #categoryManagerModal initialBreakpoint="0.7" [breakpoints]="[0, 0.7, 0.95]">
    <ng-template>
      <app-category-manager (close)="categoryManagerModal.dismiss()"></app-category-manager>
    </ng-template>
  </ion-modal>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="taskModal.present()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
